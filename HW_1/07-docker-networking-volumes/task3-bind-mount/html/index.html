<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DevOps Bind Mount Verification</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 50px;
            background: #f8fafc;
            color: #0f172a;
        }
        .container {
            max-width: 640px;
            background: #ffffff;
            padding: 36px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border: 1px solid #e2e8f0;
        }
        .badge {
            display: inline-block;
            background: #dbeafe;
            color: #1d4ed8;
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 16px;
            letter-spacing: 0.025em;
        }
        h1 {
            margin: 0 0 12px 0;
            color: #1e3a8a;
            font-size: 28px;
        }
        p {
            margin: 0;
            color: #64748b;
            font-size: 15px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="badge">Live Nginx Bind Mount</span>
        <h1>Hello students</h1>
        <p>This static asset is mounted directly from host filesystem into <code>/usr/share/nginx/html</code>.</p>
    </div>
</body>
</html>
