apiVersion: v1
kind: Pod
metadata:
  name: bish-diagnostic-pod
  namespace: bish-stage
  labels:
    app: diagnostic-suite
    engineer: bishwayan
spec:
  containers:
    - name: diagnostic-worker
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - >
          echo "Bishwayan diagnostic pod online";
          sleep 3600;
      resources:
        requests:
          memory: "16Mi"
          cpu: "10m"
        limits:
          memory: "32Mi"
          cpu: "25m"
