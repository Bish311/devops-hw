apiVersion: apps/v1
kind: Deployment
metadata:
  name: bish-web-deployment
  labels:
    app: bish-web
    tier: frontend
    author: bishwayan
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: bish-web
  template:
    metadata:
      labels:
        app: bish-web
        tier: frontend
    spec:
      containers:
        - name: web
          image: nginx:1.24-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
