apiVersion: v1
kind: Pod
metadata:
  name: bish-sidecar-pod
  labels:
    app: bish-logging
    author: bishwayan
spec:
  volumes:
    - name: shared-logs
      emptyDir: {}
  containers:
    - name: app-producer
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - >
          while true; do
            echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Event recorded by Bishwayan service" >> /var/log/app.log;
            sleep 5;
          done
      volumeMounts:
        - name: shared-logs
          mountPath: /var/log

    - name: sidecar-streamer
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - >
          touch /var/log/app.log;
          tail -n+1 -f /var/log/app.log
      volumeMounts:
        - name: shared-logs
          mountPath: /var/log
          readOnly: true
