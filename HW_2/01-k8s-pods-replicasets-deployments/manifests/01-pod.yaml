apiVersion: v1
kind: Pod
metadata:
  name: bish-web-pod
  labels:
    app: bish-web
    tier: frontend
    managed-by: bishwayan
spec:
  containers:
    - name: web-server
      image: nginx:1.25-alpine
      ports:
        - containerPort: 80
          name: http
      resources:
        requests:
          memory: "64Mi"
          cpu: "50m"
        limits:
          memory: "128Mi"
          cpu: "100m"
      livenessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 10
